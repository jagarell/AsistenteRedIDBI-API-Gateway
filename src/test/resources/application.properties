# Configuración exclusiva de tests: BD en memoria H2 (modo PostgreSQL) y
# secretos ficticios, para que el contexto cargue sin depender de servicios
# externos ni de variables de entorno reales.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=clave-de-pruebas-con-al-menos-32-bytes-1234
app.jwt.expiration-minutes=60
app.fastapi.base-url=http://localhost:8000
app.cors.allowed-origins=*
