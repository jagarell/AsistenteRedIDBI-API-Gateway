server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistente_red_idbi}
    username: ${DB_USERNAME:idbi_user}
    # La contraseña NO tiene valor por defecto: debe venir de la variable de
    # entorno DB_PASSWORD (gestor de secretos corporativo). Nunca hardcodear.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  application:
    name: idbi-api-gateway

  # SMTP para recuperación de contraseña y envío de propuestas. Sin valores
  # por defecto para host/usuario/password: deben venir del gestor de
  # secretos corporativo. Si app.mail.enabled=false (por defecto), nunca se
  # intenta conectar — ver EmailService.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@idbi.pe}
  # Secreto de firma JWT (HS256). Debe tener al menos 32 bytes y provenir del
  # vault/variable de entorno JWT_SECRET. Sin valor por defecto a propósito.
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  # URL del backend FastAPI (motor de chat/análisis).
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  # Ruta al JSON de la cuenta de servicio de Firebase (notificaciones push vía
  # FCM). Sin valor por defecto: si no se configura, FirebaseConfig no
  # inicializa el SDK y el envío de push falla explícito. Ver FirebaseConfig.
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  # Orígenes permitidos por CORS (coma-separados). En producción, restringir.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Validación de RUC/negocio real contra un proveedor externo (ej. APIs Peru,
  # apis.net.pe). Deshabilitado por defecto: si ruc-validation.enabled=false
  # (o falta la api-key), solo se aplica la validación de formato local — ver
  # RucValidationService. Nunca simula una validación exitosa.
  ruc-validation:
    enabled: ${RUC_VALIDATION_ENABLED:false}
    api-key: ${RUC_VALIDATION_API_KEY:}
  # Carpeta local donde se guardan las fotos de evidencia técnica (Router,
  # Switch, POS, plano del local, topología...). Solo para desarrollo: en
  # producción esto debería ser un bucket S3-compatible, no disco local.
  uploads:
    dir: ${UPLOADS_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # El indicador de correo de Actuator intenta conectarse por SMTP para
    # el healthcheck, sin importar app.mail.enabled — con MAIL_ENABLED=false
    # (el default) eso marca /actuator/health como DOWN aunque el gateway
    # esté perfectamente operativo, y un hosting (Railway, etc.) que use ese
    # endpoint como healthcheck reiniciaría el servicio en bucle sin motivo.
    mail:
      enabled: false
